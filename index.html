<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Channel Tag Designer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;padding:20px}
h1{font-size:24px;margin-bottom:4px}
.subtitle{color:#888;font-size:13px;margin-bottom:24px}
.layout{display:flex;gap:24px;flex-wrap:wrap}
.panel{flex:1;min-width:320px;max-width:420px}
.preview-area{flex:1;min-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.sec{background:#1a1a2e;border-radius:12px;padding:16px;margin-bottom:12px}
.sec-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#a0a0c0}
.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rw>label{font-size:12px;color:#888;min-width:60px}
input[type=text]{background:#252540;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;width:100%}
input[type=color]{-webkit-appearance:none;border:none;width:36px;height:36px;border-radius:6px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:1px solid #444;border-radius:6px}
select{background:#252540;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.btn{background:#6366f1;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:#818cf8}
.btn:disabled{opacity:.4;cursor:default}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-ghost{background:transparent;border:1px solid #444;color:#ccc}
.btn-ghost:hover{border-color:#6366f1;color:#6366f1}
.color-row{display:flex;gap:14px;flex-wrap:wrap}
.color-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.color-cell .hex{font-size:10px;color:#666}
.preset-btns,.style-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.preset-btns button,.style-btns button{padding:4px 12px;font-size:11px;border-radius:4px;border:1px solid #444;background:#1e1e3a;color:#ccc;cursor:pointer}
.preset-btns button:hover,.style-btns button:hover{border-color:#6366f1}
.style-btns button.active{border-color:#6366f1;background:#6366f1;color:#fff}
.tag-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.tag-lbl{font-size:11px;color:#666}
.tag{width:180px;height:78px;border-radius:12px;display:flex;align-items:center;justify-content:flex-start;padding:24px 30px;font-size:28px;line-height:28px;font-weight:700;box-sizing:border-box;position:relative;overflow:hidden;transition:all .3s}
.guide-box{position:absolute;left:30px;top:24px;width:120px;height:30px;border:1px dashed rgba(255,255,255,.2);border-radius:4px;pointer-events:none}
.guide-box span{position:absolute;right:2px;bottom:0;font-size:8px;color:rgba(255,255,255,.2);font-weight:400;line-height:1}
.btns-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.css-panel{background:#111;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;color:#8b8;white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-top:4px}
.canvas-crop{max-width:100%;border-radius:8px;cursor:crosshair;border:1px solid #333}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;color:#888}
.slider-row input[type=range]{flex:1}
.slider-row span{min-width:30px;text-align:right}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.num-compact{letter-spacing:0}
.file-hidden{position:absolute;width:0.1px;height:0.1px;opacity:0;overflow:hidden;z-index:-1}
</style>
</head>
<body>
<h1>Channel Tag Designer</h1>
<p class="subtitle">频道标签设计工具 · 180×78px 实时预览</p>

<div class="layout">
<div class="panel">

  <div class="sec">
    <div class="sec-title">🎨 设计参数</div>
    <div class="rw"><label>标签标题</label><input type="text" id="tagTitle" value="设计频道" maxlength="8" oninput="updateTag()"></div>
    <div class="rw">
      <label>文案字体</label>
      <select id="tagFont" onchange="updateTag()">
        <option value="'MFShangYa Noncommercial Regular',sans-serif">造字工房尚雅</option>
        <option value="'PingFang SC','Microsoft YaHei',sans-serif">苹方-简</option>
        <option value="'PingFang TC','Microsoft YaHei',sans-serif">苹方-繁</option>
        <option value="'Heiti SC','Microsoft YaHei',sans-serif">黑体-简</option>
        <option value="'Heiti TC','Microsoft YaHei',sans-serif">黑体-繁</option>
        <option value="'Hiragino Sans GB','Microsoft YaHei',sans-serif">冬青黑体简体</option>
        <option value="'Hiragino Sans','Microsoft YaHei',sans-serif">Hiragino Sans</option>
        <option value="'Microsoft YaHei',sans-serif">微软雅黑</option>
        <option value="'Lantinghei SC','Microsoft YaHei',sans-serif">兰亭黑-简</option>
        <option value="'Lantinghei TC','Microsoft YaHei',sans-serif">兰亭黑-繁</option>
        <option value="'FZRuiZhengHeiS','Microsoft YaHei',sans-serif">方正锐正黑</option>
        <option value="'FZLanTingYuanS','Microsoft YaHei',sans-serif">方正兰亭圆</option>
        <option value="'FZZhongDengXian','Microsoft YaHei',sans-serif">方正中等线</option>
        <option value="'HYQiHei','Microsoft YaHei',sans-serif">汉仪雅酷黑</option>
        <option value="'MF YuanHei','Microsoft YaHei',sans-serif">造字工房元黑体</option>
        <option value="'MF FangHei','Microsoft YaHei',sans-serif">造字工房方黑体</option>
        <option value="'Alibaba PuHuiTi 3.0','Microsoft YaHei',sans-serif">阿里巴巴普惠体 3.0</option>
        <option value="'HarmonyOS Sans','Microsoft YaHei',sans-serif">HarmonyOS Sans</option>
      </select>
      <button class="btn-sm btn-ghost" onclick="document.getElementById('fontFileInput').click()">📁 安装字体</button>
      <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden" onchange="installFont(this.files[0])">
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">🎨 颜色设置</div>
    <div class="color-row">
      <div class="color-cell"><label>常态文字</label><input type="color" id="nText" value="#dedfdf" oninput="updateTag()"><span class="hex" id="nTextHex">#dedfdf</span></div>
      <div class="color-cell"><label>选中背景</label><input type="color" id="aBg" value="#f43f5e" oninput="updateTag()"><span class="hex" id="aBgHex">#f43f5e</span></div>
      <div class="color-cell"><label>选中文字</label><input type="color" id="aText" value="#ffffff" oninput="updateTag()"><span class="hex" id="aTextHex">#ffffff</span></div>
    </div>
    <div class="color-row" id="gradColors" style="display:none;margin-top:10px">
      <div class="color-cell"><label>渐变起点</label><input type="color" id="gStart" value="#f43f5e" oninput="updateTag()"><span class="hex" id="gStartHex">#f43f5e</span></div>
      <div class="color-cell"><label>渐变终点</label><input type="color" id="gEnd" value="#6366f1" oninput="updateTag()"><span class="hex" id="gEndHex">#6366f1</span></div>
      <div class="color-cell"><label>渐变角度</label><select id="gAngle" onchange="updateTag()"><option value="135">↘ 135°</option><option value="90">→ 90°</option><option value="45">↗ 45°</option><option value="0">↑ 0°</option><option value="180">← 180°</option><option value="270">↓ 270°</option></select></div>
    </div>
    <div style="font-size:11px;color:#666;margin-top:10px">预设配色</div>
    <div class="preset-btns">
      <button onclick="preset('rose')">玫红</button>
      <button onclick="preset('purple')">紫色</button>
      <button onclick="preset('blue')">蓝色</button>
      <button onclick="preset('green')">绿色</button>
      <button onclick="preset('orange')">橙色</button>
      <button onclick="preset('dark')">暗黑</button>
    </div>
    <div style="font-size:11px;color:#666;margin-top:10px">标签样式</div>
    <div class="style-btns" id="styleBtns">
      <button class="active" onclick="setStyle('solid',this)">Solid</button>
      <button onclick="setStyle('outline',this)">Outline</button>
      <button onclick="setStyle('soft',this)">Soft</button>
      <button onclick="setStyle('pill',this)">Pill</button>
      <button onclick="setStyle('gradient',this)">Gradient</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">🖼 参考图提取配色 &amp; 文字</div>
    <div class="rw">
      <button class="btn" onclick="document.getElementById('refInput').click()">📤 上传参考图</button>
      <input type="file" id="refInput" accept="image/*" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden" onchange="loadRef(this.files[0])">
      <button class="btn" id="extractBtn" disabled onclick="extractColors()">🎨 提取配色</button>
      <button class="btn" id="cropBtn" disabled onclick="startCrop()">🔪 切图合成</button>
    </div>
    <div id="refPreview" style="display:none;margin-top:8px"><img id="refPreviewImg" style="max-width:100%;max-height:120px;border-radius:8px;border:1px solid #333"></div>
    <div id="cropArea" style="display:none;margin-top:8px">
      <canvas id="cropCanvas" class="canvas-crop"></canvas>
      <div style="margin-top:6px;display:flex;gap:6px">
        <button class="btn btn-sm" onclick="confirmCrop()">✅ 确认框选</button>
        <button class="btn-sm btn-ghost" onclick="cancelCrop()">取消</button>
      </div>
    </div>
    <div id="cutoutArea" style="display:none;margin-top:8px">
      <canvas id="cutoutPreview" style="max-width:100%;border:1px solid #333;border-radius:6px"></canvas>
      <div class="slider-row"><label>去背景强度</label><input type="range" id="tol" min="5" max="80" value="20" oninput="updateCutout()"><span id="tolVal">20</span></div>
      <div class="rw" style="margin-top:4px"><label>文字亮度</label><select id="textMode" onchange="updateCutout()"><option value="auto">自动</option><option value="light">亮色文字(深底)</option><option value="dark">暗色文字(浅底)</option></select></div>
      <div class="slider-row"><label>缩放</label><input type="range" id="cutS" min="10" max="2000" value="300" step="1" oninput="syncScale('slider')"><input type="number" id="cutSNum" min="1" max="200" value="30" step="0.1" style="width:65px;text-align:center" oninput="syncScale('num')"><span>%</span><span id="cutSVal">0.30x</span></div>
      <div class="slider-row"><label>X偏移</label><input type="range" id="cutX" min="0" max="100" value="0" oninput="updateCutout()"><span id="cutXVal">0</span>px</div>
      <div class="slider-row"><label>Y偏移</label><input type="range" id="cutY" min="0" max="54" value="0" oninput="updateCutout()"><span id="cutYVal">0</span>px</div>
      <button class="btn-sm btn-ghost" onclick="clearCutout()" style="margin-top:6px">✕ 清除切图</button>
      <button class="btn-sm btn-ghost" onclick="clearCutout()" style="margin-top:6px;margin-left:4px">✕ 清除切图</button>
    </div>
  </div>

</div>

<div class="preview-area">
  <div class="sec-title" style="align-self:flex-start">👁 实时预览</div>
  <div class="tag-wrap">
    <span class="tag-lbl">✦ 常态</span>
    <div class="tag" id="tagN"><span id="tagNText">设计频道</span><div class="guide-box"><span>规范区 120×30</span></div></div>
  </div>
  <div class="tag-wrap">
    <span class="tag-lbl">✦ 选中状态</span>
    <div class="tag" id="tagA"><span id="tagAText">设计频道</span><div class="guide-box"><span>规范区 120×30</span></div></div>
  </div>
  <div class="btns-row">
    <button class="btn" onclick="downloadTag('normal')">⬇ 下载常态标签 (PNG)</button>
    <button class="btn" onclick="downloadTag('active')">⬇ 下载选中标签 (PNG)</button>
  </div>
  <div class="sec" style="width:100%;margin-top:0">
    <div class="sec-title">✦ 尺寸: 180 × 78 px</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">📋 CSS 代码 <button class="btn-sm btn-ghost" onclick="copyCSS()">📋 复制</button></div>
    <div class="css-panel" id="cssCode"></div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
var tagN=document.getElementById("tagN"),tagA=document.getElementById("tagA");
var tagNText=document.getElementById("tagNText"),tagAText=document.getElementById("tagAText");
var tagTitle=document.getElementById("tagTitle"),tagFont=document.getElementById("tagFont");
var nText=document.getElementById("nText"),aBg=document.getElementById("aBg"),aText=document.getElementById("aText");
var nTextHex=document.getElementById("nTextHex"),aBgHex=document.getElementById("aBgHex"),aTextHex=document.getElementById("aTextHex");
var extractBtn=document.getElementById("extractBtn"),cropBtn=document.getElementById("cropBtn");
var toastEl=document.getElementById("toast");
var _t;
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(_t);_t=setTimeout(function(){toastEl.classList.remove("on")},2000)}

function fmtText(t){if(!t)return"";var h="";for(var i=0;i<t.length;i++){var c=t[i];h+=/\d/.test(c)?'<span class="num-compact">'+c+"</span>":c}return h}

var curStyle="solid";
var presets={
  rose:{nText:"#dedfdf",aBg:"#f43f5e",aText:"#ffffff"},
  purple:{nText:"#a0a0c0",aBg:"#6366f1",aText:"#ffffff"},
  blue:{nText:"#88aacc",aBg:"#3b82f6",aText:"#ffffff"},
  green:{nText:"#88ccaa",aBg:"#22c55e",aText:"#ffffff"},
  orange:{nText:"#ccaa88",aBg:"#f59e0b",aText:"#ffffff"},
  dark:{nText:"#888888",aBg:"#444444",aText:"#ffffff"}
};
function preset(k){var p=presets[k];nText.value=p.nText;aBg.value=p.aBg;aText.value=p.aText;updateTag()}
function setStyle(s,btn){curStyle=s;var btns=document.querySelectorAll("#styleBtns button");for(var i=0;i<btns.length;i++)btns[i].classList.remove("active");btn.classList.add("active");
  document.getElementById('gradColors').style.display=s==='gradient'?'flex':'none';
  updateTag()}

function applyStyleToTag(tag,state){
  var abg=aBg.value,atxt=aText.value,ntxt=nText.value;
  var gs=document.getElementById('gStart').value,ge=document.getElementById('gEnd').value;
  var ga=document.getElementById('gAngle').value;
  tag.style.transition='all .3s';
  tag.style.boxShadow='none';
  tag.style.border='none';
  tag.style.borderRadius='12px';
  tag.style.backdropFilter='none';
  if(state==='normal'){
    if(curStyle==='solid'){
      tag.style.background='transparent';tag.style.color=ntxt;
    }else if(curStyle==='outline'){
      tag.style.background='transparent';tag.style.color=ntxt;tag.style.border='2px solid '+ntxt;
    }else if(curStyle==='soft'){
      tag.style.background=ntxt+'22';tag.style.color=ntxt;tag.style.backdropFilter='blur(4px)';
    }else if(curStyle==='pill'){
      tag.style.background='transparent';tag.style.color=ntxt;tag.style.borderRadius='39px';
    }else if(curStyle==='gradient'){
      tag.style.background='linear-gradient('+ga+'deg,'+gs+'44,'+ge+'44)';tag.style.color=ntxt;
    }
  }else{
    if(curStyle==='solid'){
      tag.style.background=abg;tag.style.color=atxt;
      tag.style.boxShadow='0 0 0 3px '+abg+', 0 8px 24px rgba(0,0,0,0.3)';
    }else if(curStyle==='outline'){
      tag.style.background='transparent';tag.style.color=atxt;tag.style.border='3px solid '+atxt;
    }else if(curStyle==='soft'){
      tag.style.background=abg+'33';tag.style.color=atxt;
      tag.style.backdropFilter='blur(4px)';tag.style.boxShadow='0 8px 24px rgba(0,0,0,0.3)';
    }else if(curStyle==='pill'){
      tag.style.background=abg;tag.style.color=atxt;tag.style.borderRadius='39px';
      tag.style.boxShadow='0 0 0 3px '+abg+', 0 8px 24px rgba(0,0,0,0.3)';
    }else if(curStyle==='gradient'){
      tag.style.background='linear-gradient('+ga+'deg,'+gs+','+ge+')';tag.style.color=atxt;
    }
  }
}

function updateTag(){
  var t=tagTitle.value,font=tagFont.value,txt=fmtText(t);
  tagNText.innerHTML=txt;tagAText.innerHTML=txt;
  tagN.style.fontFamily=font;tagA.style.fontFamily=font;
  nTextHex.textContent=nText.value;aBgHex.textContent=aBg.value;aTextHex.textContent=aText.value;
  var gs=document.getElementById('gStart'),ge=document.getElementById('gEnd');
  document.getElementById('gStartHex').textContent=gs.value;
  document.getElementById('gEndHex').textContent=ge.value;
  applyStyleToTag(tagN,'normal');applyStyleToTag(tagA,'active');
  updateCSS();
}

function updateCSS(){
  var font=tagFont.value;
  var css='.channel-tag {'+
    '\n  width: 180px;'+
    '\n  height: 78px;'+
    '\n  border-radius: 12px;'+
    '\n  display: flex;'+
    '\n  align-items: center;'+
    '\n  justify-content: flex-start;'+
    '\n  padding: 24px 30px;'+
    '\n  font-size: 28px;'+
    '\n  line-height: 28px;'+
    '\n  font-weight: 700;'+
    '\n  font-family: '+font+';'+
    '\n  box-sizing: border-box;'+
    '\n  background: transparent;'+
    '\n  border: none;'+
    '\n  color: '+nText.value+';'+
    '\n  cursor: pointer;'+
    '\n  transition: all 0.3s ease;'+
    '\n}';
  if(curStyle==='gradient'){
    var gs=document.getElementById('gStart').value,ge=document.getElementById('gEnd').value;
    var ga=document.getElementById('gAngle').value;
    css+='\n\n.channel-tag:hover,\n.channel-tag.active {'+
      '\n  background: linear-gradient('+ga+'deg, '+gs+', '+ge+');'+
      '\n  color: '+aText.value+';'+
      '\n}';
  }else{
    css+='\n\n.channel-tag:hover,\n.channel-tag.active {'+
      '\n  background: '+aBg.value+';'+
      '\n  color: '+aText.value+';'+
      '\n  box-shadow: 0 0 0 3px '+aBg.value+', 0 8px 24px rgba(0,0,0,0.3);'+
      '\n}';
  }
  document.getElementById('cssCode').textContent=css;
}

function copyCSS(){
  navigator.clipboard.writeText(document.getElementById('cssCode').textContent);
  toast('已复制到剪贴板!');
}

var refImg=null,cropStart=null,cropEnd=null,rawCrop=null;

function loadRef(f){
  if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    var i=new Image();
    i.onload=function(){
      refImg=i;
      extractBtn.disabled=false;
      cropBtn.disabled=false;
      document.getElementById('refPreview').style.display='block';
      document.getElementById('refPreviewImg').src=e.target.result;
      toast('参考图已加载');
    };
    i.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function extractColors(){
  if(!refImg)return toast('请先上传参考图');
  var c=document.createElement('canvas'),sz=50;c.width=sz;c.height=sz;
  var ctx=c.getContext('2d');ctx.drawImage(refImg,0,0,sz,sz);
  var d=ctx.getImageData(0,0,sz,sz).data,samples=[];
  for(var i=0;i<d.length;i+=4)samples.push({r:d[i],g:d[i+1],b:d[i+2]});

  function km(pts,k,iters){
    var centroids=pts.slice(0,k).map(function(p){return{r:p.r,g:p.g,b:p.b}});
    for(var iter=0;iter<iters;iter++){
      var cl=[];for(var j=0;j<k;j++)cl.push([]);
      for(var pi=0;pi<pts.length;pi++){
        var p=pts[pi],best=0,bestD=Infinity;
        for(var ci=0;ci<centroids.length;ci++){
          var cc=centroids[ci],dr=p.r-cc.r,dg=p.g-cc.g,db=p.b-cc.b,dd=dr*dr+dg*dg+db*db;
          if(dd<bestD){bestD=dd;best=ci}
        }
        cl[best].push(p);
      }
      centroids=cl.map(function(cl){
        if(!cl.length)return{r:0,g:0,b:0};
        return{r:Math.round(cl.reduce(function(s,p){return s+p.r},0)/cl.length),g:Math.round(cl.reduce(function(s,p){return s+p.g},0)/cl.length),b:Math.round(cl.reduce(function(s,p){return s+p.b},0)/cl.length)};
      });
    }
    return centroids.sort(function(a,b){return(b.r+b.g+b.b)-(a.r+a.g+a.b)});
  }

  var cols=km(samples,5,5),tc=cols[2];
  var hex='#'+[tc.r,tc.g,tc.b].map(function(v){return v.toString(16).padStart(2,'0')}).join('');
  nText.value=hex;toast('已提取配色（仅文字色）');updateTag();
}

function startCrop(){
  if(!refImg)return toast('请先上传参考图');
  document.getElementById('cutoutArea').style.display='none';
  // restore tag text visibility
  [tagN,tagA].forEach(function(tag){
    var els=tag.querySelectorAll('.cutout');for(var ei=0;ei<els.length;ei++)els[ei].remove();
  });
  tagNText.style.display='';tagAText.style.display='';
  var cv=document.getElementById('cropCanvas'),mw=380;
  cv._s=Math.min(1,mw/refImg.width);
  cv.width=Math.round(refImg.width*cv._s);cv.height=Math.round(refImg.height*cv._s);
  var ctx=cv.getContext('2d');ctx.drawImage(refImg,0,0,cv.width,cv.height);
  cropStart=null;cropEnd=null;
  cv.onmousedown=function(e){cropStart={x:e.offsetX,y:e.offsetY};cropEnd=null};
  cv.onmousemove=function(e){if(!cropStart)return;cropEnd={x:e.offsetX,y:e.offsetY};ctx.drawImage(refImg,0,0,cv.width,cv.height);ctx.strokeStyle='#22c55e';ctx.lineWidth=2;ctx.setLineDash([6,3]);var x=Math.min(cropStart.x,cropEnd.x),y=Math.min(cropStart.y,cropEnd.y),w=Math.abs(cropEnd.x-cropStart.x),h=Math.abs(cropEnd.y-cropStart.y);ctx.strokeRect(x,y,w,h)};
  cv.onmouseup=function(e){cropEnd={x:e.offsetX,y:e.offsetY}};
  document.getElementById('cropArea').style.display='block';toast('框选文字区域');
}

function confirmCrop(){
  if(!cropStart||!cropEnd)return toast('请先框选区域');
  var cv=document.getElementById('cropCanvas'),s=cv._s;
  var x=Math.round(Math.min(cropStart.x,cropEnd.x)/s),y=Math.round(Math.min(cropStart.y,cropEnd.y)/s);
  var w=Math.round(Math.abs(cropEnd.x-cropStart.x)/s),h=Math.round(Math.abs(cropEnd.y-cropStart.y)/s);
  if(w<5||h<5)return toast('框选区域太小');
  var cc=document.createElement('canvas');cc.width=w;cc.height=h;
  cc.getContext('2d').drawImage(refImg,x,y,w,h,0,0,w,h);
  rawCrop={canvas:cc,w:w,h:h};
  // Auto-scale: fit within 120x30 guide area
  var as=Math.min(120/w*100,30/h*100,200);
  as=Math.max(1,as);
  document.getElementById('cutSNum').value=as.toFixed(1);
  document.getElementById('cutS').value=Math.round(as*10);
  // Auto-center in tag
  var tw=Math.round(w*as),th=Math.round(h*as);
  document.getElementById('cutX').value=Math.max(0,Math.round(30+(120-tw)/2));
  document.getElementById('cutY').value=Math.max(0,Math.round(24+(30-th)/2));
  document.getElementById('cropArea').style.display='none';
  document.getElementById('cutoutArea').style.display='block';
  updateCutout();
  toast('框选完成，拖滑块实时调整');
}

function cancelCrop(){document.getElementById('cropArea').style.display='none';cropStart=null;cropEnd=null}

function rmBg(id,tol,tm){
  var d=id.data,w=id.width,h=id.height;
  var hist={};
  function add(r,g,b){
    var key=Math.round(r/16)+','+Math.round(g/16)+','+Math.round(b/16);
    hist[key]=(hist[key]||0)+1;
  }
  for(var x=0;x<w;x++){var i4=x*4;add(d[i4],d[i4+1],d[i4+2]);i4=((h-1)*w+x)*4;add(d[i4],d[i4+1],d[i4+2])}
  for(var y=1;y<h-1;y++){var i4=y*w*4;add(d[i4],d[i4+1],d[i4+2]);i4=(y*w+w-1)*4;add(d[i4],d[i4+1],d[i4+2])}
  var bestK='',bestV=0;
  for(var k in hist){if(hist[k]>bestV){bestV=hist[k];bestK=k}}
  var p=bestK.split(','),mr=+p[0]*16,mg=+p[1]*16,mb=+p[2]*16;
  var bgBright=(mr+mg+mb)/3,cutoff=tol*5;
  for(var i=0;i<d.length;i+=4){
    var dr=d[i]-mr,dg=d[i+1]-mg,db=d[i+2]-mb;
    var dist=Math.sqrt(dr*dr+dg*dg+db*db);
    var pb=(d[i]+d[i+1]+d[i+2])/3;
    if(dist<cutoff){
      if(tm==='light'&&pb>bgBright)continue;
      if(tm==='dark'&&pb<bgBright)continue;
      d[i+3]=0;
    }
  }
}

function bgRemoved(){
  if(!rawCrop)return null;
  var tol=+document.getElementById('tol').value,s=+document.getElementById('cutSNum').value/100;
  document.getElementById('tolVal').textContent=tol;
  document.getElementById('cutSVal').textContent=s.toFixed(2)+'x';
  var t=document.createElement('canvas');t.width=rawCrop.w;t.height=rawCrop.h;
  var tctx=t.getContext('2d');tctx.drawImage(rawCrop.canvas,0,0);
  var id=tctx.getImageData(0,0,t.width,t.height);
  var tm=document.getElementById('textMode').value;
  rmBg(id,tol,tm);tctx.putImageData(id,0,0);
  return {canvas:t,scale:s};
}

function upCutPrev(){
  var r=bgRemoved();if(!r)return;
  var pv=document.getElementById('cutoutPreview');pv.width=r.canvas.width*r.scale;pv.height=r.canvas.height*r.scale;
  var pctx=pv.getContext('2d');pctx.clearRect(0,0,pv.width,pv.height);pctx.drawImage(r.canvas,0,0,pv.width,pv.height);
}

function syncScale(src){
  var sl=document.getElementById('cutS'),nm=document.getElementById('cutSNum');
  if(src==='slider'){nm.value=(sl.value/10).toFixed(1)}
  else{var v=parseFloat(nm.value)||30;v=Math.max(1,Math.min(200,v));nm.value=v.toFixed(1);sl.value=Math.round(v*10)}
  updateCutout();
}

function updateCutout(){
  if(!rawCrop)return;
  clearTimeout(updateCutout._t);
  updateCutout._t=setTimeout(_updateCutoutNow,30);
}
function _updateCutoutNow(){
  var r=bgRemoved();if(!r)return;
  var ox=+document.getElementById('cutX').value,oy=+document.getElementById('cutY').value;
  document.getElementById('cutXVal').textContent=ox;document.getElementById('cutYVal').textContent=oy;
  upCutPrev();
  // Convert cutout to data URL for reliable img display
  var dataUrl;
  try{dataUrl=r.canvas.toDataURL('image/png')}catch(e){toast('切图失败: '+e.message);return}
  var tags=[tagN,tagA],texts=[tagNText,tagAText];
  for(var ti=0;ti<tags.length;ti++){
    var tag=tags[ti];
    var els=tag.querySelectorAll('.cutout');for(var ei=0;ei<els.length;ei++)els[ei].remove();
    if(tagTitle.value)texts[ti].style.display='none';
    var img=document.createElement('img');img.className='cutout';
    img.src=dataUrl;
    img.width=r.canvas.width*r.scale;img.height=r.canvas.height*r.scale;
    img.style.position='absolute';img.style.left=ox+'px';img.style.top=oy+'px';img.style.pointerEvents='none';
    img.style.zIndex='10';img.style.outline='1px dashed rgba(99,102,241,0.6)';img.style.outlineOffset='-1px';
    img.style.imageRendering='auto';
    tag.appendChild(img);
  }
  toast('已合成到标签');
}

function clearCutout(){
  var tags=[tagN,tagA];
  for(var ti=0;ti<tags.length;ti++){
    var els=tags[ti].querySelectorAll('.cutout');for(var ei=0;ei<els.length;ei++)els[ei].remove();
  }
  tagNText.style.display='';tagAText.style.display='';
  toast('已清除切图');
}

function downloadTag(state){
  var tag=state==='active'?tagA:tagN;
  var cv=document.createElement('canvas');cv.width=360;cv.height=156;
  var ctx=cv.getContext('2d');ctx.scale(2,2);
  var cs=getComputedStyle(tag);
  var bg=cs.backgroundColor,bgImg=cs.backgroundImage,color=cs.color,font=cs.fontFamily;
  var txt='',spans=tag.querySelectorAll('span');
  for(var si=0;si<spans.length;si++){var s=spans[si];if(s.id&&s.id.indexOf('Text')>=0)txt=s.textContent}
  var cutoutEl=tag.querySelector('.cutout');

  function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }

  function parseGradient(bgImgStr){
    var m=bgImgStr.match(/linear-gradient\((\d+)deg,\s*(#[0-9a-fA-F]{3,6}|rgba?\([^)]+\))\s*,\s*(#[0-9a-fA-F]{3,6}|rgba?\([^)]+\))\)/);
    if(!m)return null;
    return {angle:parseInt(m[1]),start:m[2],end:m[3]};
  }

  // Draw background
  var gradInfo=parseGradient(bgImg);
  if(gradInfo){
    // Gradient background
    var rad=gradInfo.angle*Math.PI/180;
    var x1=90-Math.cos(rad)*90,y1=39-Math.sin(rad)*39;
    var x2=90+Math.cos(rad)*90,y2=39+Math.sin(rad)*39;
    var g=ctx.createLinearGradient(x1,y1,x2,y2);
    g.addColorStop(0,gradInfo.start);g.addColorStop(1,gradInfo.end);
    ctx.fillStyle=g;rr(0,0,180,78,12);ctx.fill();
  }else{
    var isTrans=!bg||bg==='rgba(0, 0, 0, 0)'||bg==='transparent'||(bg.indexOf('rgba')===0&&parseFloat(bg.split(',')[3])<0.1);
    if(!isTrans){ctx.fillStyle=bg;rr(0,0,180,78,12);ctx.fill()}
  }

  // Draw cutout image if present
  if(cutoutEl){
    var cx=parseInt(cutoutEl.style.left)||0,cy=parseInt(cutoutEl.style.top)||0;
    var cw=cutoutEl.width||cutoutEl.naturalWidth,ch=cutoutEl.height||cutoutEl.naturalHeight;
    ctx.drawImage(cutoutEl,cx,cy,cw,ch);
  }

  // Draw text if no cutout
  if(txt&&!cutoutEl){ctx.fillStyle=color;ctx.font='700 28px '+font;ctx.textBaseline='middle';ctx.fillText(txt,30,39)}

  cv.toBlob(function(blob){
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='channel-tag-'+state+'.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);toast('已下载: '+state);
  });
}

function installFont(f){
  if(!f)return;
  var name=f.name.replace(/\.[^.]+$/,'');
  var url=URL.createObjectURL(f);
  var ff=new FontFace(name,'url('+url+')');
  ff.load().then(function(font){
    document.fonts.add(font);
    var opt=document.createElement('option');
    opt.value="'"+name+"',sans-serif";
    opt.textContent=name+' (自定义)';
    var g=document.getElementById('installedFontsGroup');
    if(!g){g=document.createElement('optgroup');g.id='installedFontsGroup';g.label='自定义字体';tagFont.appendChild(g)}
    g.appendChild(opt);
    tagFont.value=opt.value;
    updateTag();
    URL.revokeObjectURL(url);
    toast('字体已安装: '+name);
  }).catch(function(e){toast('字体安装失败');URL.revokeObjectURL(url)});
}

updateTag();
</script>
