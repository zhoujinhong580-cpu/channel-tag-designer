<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Channel Tag Designer v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg:#09090f; --panel:#12121f; --border:#2a2a40; --text:#d0d0e0;
  --muted:#6b6b80; --accent:#6366f1; --accent2:#818cf8; --danger:#ef4444;
  --radius:10px; --radius-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--muted);font-size:13px;margin-top:4px}
.layout{display:flex;gap:20px;max-width:1200px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:360px;display:flex;flex-direction:column;gap:14px}
.preview-panel{width:500px}
.sec-title{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;padding:8px 12px;background:#0a0a14;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;resize:vertical;font-family:inherit}
textarea{min-height:52px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=color]{-webkit-appearance:none;width:32px;height:28px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:transparent;padding:2px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border-radius:3px;border:none}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:var(--border);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--accent);border-radius:50%;cursor:pointer;border:2px solid #fff}
input[type=number]{width:64px;padding:6px 8px;background:#0a0a14;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;text-align:center;outline:none}
input[type=number]:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;transition:.15s;border:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.preset-sizes,.gradient-dirs{display:flex;gap:5px;flex-wrap:wrap}
.preset-sizes button,.gradient-dirs button{padding:5px 10px;font-size:11px;border-radius:4px;border:1px solid var(--border);background:#1a1a2e;color:var(--muted);cursor:pointer;transition:.15s}
.preset-sizes button:hover,.gradient-dirs button:hover,.preset-sizes button.active,.gradient-dirs button.active{border-color:var(--accent);color:var(--accent)}
.preset-sizes button.active{background:rgba(99,102,241,.15)}
.gradient-dirs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1}
.slider-row .val{font-size:12px;color:var(--muted);min-width:40px;text-align:right;font-family:monospace}

.preview-section{display:flex;flex-direction:column;gap:24px}
.tag-group{display:flex;flex-direction:column;align-items:center;gap:6px}
.tag-label{font-size:11px;color:var(--muted);letter-spacing:1px}
.tag-canvas{border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:100%}

.composite-section{background:#0a0a14;border:1px dashed var(--border);border-radius:var(--radius);padding:16px;position:relative;min-height:160px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;user-select:none}
.composite-section:hover{border-color:var(--accent)}
.composite-section.has-bg{border-style:solid;cursor:default}
.composite-hint{color:var(--muted);font-size:13px;text-align:center;pointer-events:none}
.composite-canvas{max-width:100%;max-height:400px;display:block}
.composite-overlay{position:absolute;cursor:move;border-radius:2px;opacity:.85;pointer-events:auto}
.composite-controls{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.download-section{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.css-panel{background:#0a0a14;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:11px;font-family:'SF Mono',monospace;color:var(--muted);white-space:pre-wrap;max-height:200px;overflow-y:auto;line-height:1.5;position:relative}
.css-panel button{position:sticky;float:right;top:0;margin-bottom:6px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}

@media(max-width:900px){.panel,.preview-panel{width:100%}}
</style>
</head>
<body>

<div class="header">
  <h1>🏷️ Channel Tag Designer v2</h1>
  <p>频道标签设计工具 · 支持自定义尺寸、多行文案、渐变背景、合成导出</p>
</div>

<div class="layout">
  <!-- ====== LEFT PANEL: Controls ====== -->
  <div class="panel">
    <!-- 1. SIZE -->
    <div class="sec-title">📐 标签尺寸</div>
    <div class="preset-sizes" id="sizePresets">
      <button data-w="180" data-h="78" class="active">180×78</button>
      <button data-w="200" data-h="80">200×80</button>
      <button data-w="160" data-h="64">160×64</button>
      <button data-w="240" data-h="96">240×96</button>
      <button data-w="120" data-h="50">120×50</button>
      <button data-w="300" data-h="100">300×100</button>
    </div>
    <div class="row">
      <label style="min-width:auto">W</label>
      <input type="number" id="tagWidth" value="180" min="20" max="1200" step="2" onchange="onSizeChange()">
      <label style="min-width:auto">H</label>
      <input type="number" id="tagHeight" value="78" min="20" max="1200" step="2" onchange="onSizeChange()">
    </div>

    <!-- 2. TEXT -->
    <div class="sec-title">✏️ 文案</div>
    <textarea id="tagText" placeholder="输入文案（每行一个）..." oninput="renderAll()">设计频道</textarea>

    <!-- 3. FONT -->
    <div class="sec-title">🔤 字体</div>
    <select id="tagFont" onchange="renderAll()">
      <optgroup label="── 系统字体 ──">
        <option value="PingFang SC">苹方 PingFang SC</option>
        <option value="Microsoft YaHei">微软雅黑</option>
        <option value="SimHei">黑体</option>
        <option value="SimSun">宋体</option>
        <option value="KaiTi">楷体</option>
        <option value="Arial">Arial</option>
        <option value="Helvetica Neue">Helvetica Neue</option>
        <option value="Georgia">Georgia</option>
        <option value="Verdana">Verdana</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Roboto">Roboto</option>
        <option value="Poppins">Poppins</option>
        <option value="Noto Sans SC">Noto Sans SC</option>
        <option value="LXGW WenKai">霞鹜文楷</option>
        <option value="ZCOOL XiaoWei">站酷小薇</option>
      </optgroup>
      <optgroup label="── 自定义字体 ──" id="customFontGroup"></optgroup>
    </select>
    <div class="row">
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('fontFile').click()">📂 安装字体</button>
      <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" class="hidden" onchange="installFont(this.files[0])">
      <span style="font-size:10px;color:var(--muted)">.ttf .otf .woff .woff2</span>
    </div>

    <!-- 4. FONT SIZE -->
    <div class="sec-title">📏 字号</div>
    <div class="slider-row">
      <input type="range" id="fontSizeSlider" min="4" max="200" value="24" step="0.5" oninput="onFontSizeSlide()">
      <input type="number" id="fontSizeNum" value="24" min="4" max="200" step="0.5" onchange="onFontSizeNum()">
      <span class="val">px</span>
    </div>
    <div class="row" style="gap:12px">
      <label><input type="checkbox" id="boldCheck" onchange="renderAll()" checked> 加粗</label>
      <label><input type="checkbox" id="italicCheck" onchange="renderAll()"> 斜体</label>
    </div>

    <!-- 5. COLORS -->
    <div class="sec-title">🎨 颜色 & 背景</div>
    <div class="row">
      <label>文字色</label><input type="color" id="textColor" value="#dedfdf" onchange="renderAll()">
      <span class="val" id="textColorHex">#dedfdf</span>
    </div>
    <label>背景类型</label>
    <div class="row">
      <label style="display:flex;align-items:center;gap:4px">
        <input type="radio" name="bgType" value="solid" checked onchange="onBgTypeChange()"> 纯色
      </label>
      <label style="display:flex;align-items:center;gap:4px">
        <input type="radio" name="bgType" value="gradient" onchange="onBgTypeChange()"> 渐变
      </label>
    </div>
    <div id="solidBgRow" class="row">
      <label>背景色</label><input type="color" id="bgColor" value="#f43f5e" onchange="renderAll()">
      <span class="val" id="bgColorHex">#f43f5e</span>
    </div>
    <div id="gradientBgRow" class="hidden">
      <div class="row">
        <label>渐变起点</label><input type="color" id="gradStart" value="#6366f1" onchange="renderAll()">
        <span class="val" id="gradStartHex">#6366f1</span>
      </div>
      <div class="row">
        <label>渐变终点</label><input type="color" id="gradEnd" value="#a78bfa" onchange="renderAll()">
        <span class="val" id="gradEndHex">#a78bfa</span>
      </div>
      <label>渐变方向</label>
      <div class="gradient-dirs" id="gradDirs">
        <button data-dir="0" class="active">↑ 0°</button>
        <button data-dir="45">↗ 45°</button>
        <button data-dir="90">→ 90°</button>
        <button data-dir="135">↘ 135°</button>
        <button data-dir="180">← 180°</button>
        <button data-dir="270">↓ 270°</button>
      </div>
    </div>

    <!-- 6. CORNER RADIUS -->
    <div class="sec-title">⏹️ 圆角</div>
    <div class="slider-row">
      <input type="range" id="radiusSlider" min="0" max="100" value="12" step="1" oninput="onRadiusSlide()">
      <input type="number" id="radiusNum" value="12" min="0" max="100" step="1" onchange="onRadiusNum()">
      <span class="val">px</span>
    </div>
  </div>

  <!-- ====== RIGHT PANEL: Preview + Composite + Download ====== -->
  <div class="panel preview-panel">
    <div class="preview-section">
      <!-- Normal state preview -->
      <div class="tag-group">
        <span class="tag-label">✦ 常态标签</span>
        <canvas class="tag-canvas" id="normalCanvas" width="360" height="156"></canvas>
      </div>
      <!-- Active state preview -->
      <div class="tag-group">
        <span class="tag-label">✦ 选中标签</span>
        <canvas class="tag-canvas" id="activeCanvas" width="360" height="156"></canvas>
      </div>
    </div>

    <!-- Composite background -->
    <div class="sec-title">🖼️ 合成底图</div>
    <div class="composite-section" id="compositeDrop" onclick="document.getElementById('bgFile').click()">
      <span class="composite-hint">📤 点击上传底图<br><small>支持拖拽定位标签</small></span>
      <input type="file" id="bgFile" accept="image/*" class="hidden" onchange="loadBackground(this.files[0])">
    </div>
    <div class="composite-controls hidden" id="compositeControls">
      <button class="btn btn-outline btn-sm" onclick="resetLabelPos()">🔄 重置位置</button>
      <button class="btn btn-danger btn-sm" onclick="clearBackground()">✕ 清除底图</button>
    </div>

    <!-- Downloads -->
    <div class="download-section">
      <button class="btn btn-primary" onclick="downloadLabelPNG()">💾 下载标签 PNG</button>
      <button class="btn btn-primary" onclick="downloadCompositePNG()" id="downloadCompositeBtn" disabled>🖼️ 下载合成图 PNG</button>
      <button class="btn btn-primary" onclick="downloadZIP()" id="downloadZipBtn">📦 打包 ZIP</button>
    </div>

    <!-- CSS output -->
    <div class="sec-title">📋 CSS 代码</div>
    <div class="css-panel" id="cssCode"><button class="btn btn-outline btn-sm" onclick="copyCSS()" style="float:right">📋 复制</button><span id="cssContent">选择参数即可生成...</span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
const state = {
  w: 180, h: 78, radius: 12,
  text: '设计频道', font: 'PingFang SC', fontSize: 24,
  bold: true, italic: false,
  textColor: '#dedfdf',
  bgType: 'solid', bgColor: '#f43f5e',
  gradStart: '#6366f1', gradEnd: '#a78bfa', gradDir: 0,
  bgImg: null, bgImgObj: null,
  labelX: 0, labelY: 0,
  dragging: false, dragOX: 0, dragOY: 0,
  customFonts: {}
};

// ============ DOM REFS ============
const $ = id => document.getElementById(id);
const normalCanvas = $('normalCanvas'), activeCanvas = $('activeCanvas');
const nctx = normalCanvas.getContext('2d'), actx = activeCanvas.getContext('2d');

// ============ RENDERING ============
function getPadding() {
  const pV = Math.max(2, Math.min(state.h * 0.08, 20));
  const pH = Math.max(2, Math.min(state.w * 0.08, 20));
  return { top: pV, bottom: pV, left: pH, right: pH };
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fillGradient(ctx, x, y, w, h) {
  const angle = state.gradDir * Math.PI / 180;
  const cx = x + w / 2, cy = y + h / 2;
  const halfDiag = Math.sqrt(w * w + h * h) / 2;
  const x1 = cx - Math.cos(angle) * halfDiag;
  const y1 = cy - Math.sin(angle) * halfDiag;
  const x2 = cx + Math.cos(angle) * halfDiag;
  const y2 = cy + Math.sin(angle) * halfDiag;
  const grad = ctx.createLinearGradient(x1, y1, x2, y2);
  grad.addColorStop(0, state.gradStart);
  grad.addColorStop(1, state.gradEnd);
  ctx.fillStyle = grad;
  ctx.fill();
}

function renderTag(ctx, isActive) {
  const { w, h, radius, text, font, fontSize, bold, italic, textColor, bgType, bgColor } = state;
  const scale = 2; // render at 2x for retina
  ctx.canvas.width = w * scale;
  ctx.canvas.height = h * scale;
  ctx.scale(scale, scale);
  ctx.clearRect(0, 0, w, h);

  // Background
  if (isActive) {
    drawRoundedRect(ctx, 0, 0, w, h, radius);
    ctx.save(); ctx.clip();
    if (bgType === 'gradient') {
      fillGradient(ctx, 0, 0, w, h);
    } else {
      ctx.fillStyle = bgColor; ctx.fill();
    }
    ctx.restore();
  }

  // Text
  const pad = getPadding();
  const lines = text.split('\n');
  const fontStyle = (bold ? 'bold ' : '') + (italic ? 'italic ' : '') + fontSize + 'px "' + font + '", sans-serif';
  ctx.font = fontStyle;
  ctx.fillStyle = isActive ? (bgType === 'gradient' ? '#ffffff' : textColor) : textColor;
  ctx.textBaseline = 'top';

  const lineHeight = fontSize * 1.35;
  const totalH = lines.length * lineHeight;
  const availW = w - pad.left - pad.right;
  const startY = pad.top + Math.max(0, (h - pad.top - pad.bottom - totalH) / 2);

  for (let i = 0; i < lines.length; i++) {
    const y = startY + i * lineHeight;
    const metrics = ctx.measureText(lines[i]);
    const textW = metrics.width;
    const x = pad.left + Math.max(0, (availW - textW) / 2);
    ctx.fillText(lines[i], x, y);
  }
}

function renderAll() {
  renderTag(nctx, false);
  renderTag(actx, true);
  updateCSS();
  if (state.bgImg) renderComposite();
}

// ============ AUTO FONT SIZE ============
function calcBestFontSize() {
  const { w, h, text } = state;
  const pad = getPadding();
  const lines = text.split('\n');
  // Binary search for largest fontSize that fits
  let lo = 4, hi = Math.min(h, 200), best = 4;
  const tmpCanvas = document.createElement('canvas');
  const tmpCtx = tmpCanvas.getContext('2d');
  while (lo <= hi) {
    const mid = Math.round((lo + hi) / 2 * 2) / 2; // 0.5 step
    const fontStyle = (state.bold ? 'bold ' : '') + (state.italic ? 'italic ' : '') + mid + 'px "' + state.font + '", sans-serif';
    tmpCtx.font = fontStyle;
    const lineH = mid * 1.35;
    const totalH = lines.length * lineH;
    const availW = w - pad.left - pad.right;
    const availH = h - pad.top - pad.bottom;
    let fitsW = true;
    for (const line of lines) {
      if (tmpCtx.measureText(line).width > availW && lines.length === 1) { fitsW = false; break; }
    }
    if (totalH <= availH && fitsW) { best = mid; lo = mid + 0.5; }
    else { hi = mid - 0.5; }
  }
  return Math.max(4, Math.min(best, 200));
}

function onSizeChange() {
  state.w = parseInt($('tagWidth').value) || 180;
  state.h = parseInt($('tagHeight').value) || 78;
  state.fontSize = calcBestFontSize();
  $('fontSizeSlider').value = state.fontSize;
  $('fontSizeNum').value = state.fontSize;
  // Update preset buttons
  document.querySelectorAll('#sizePresets button').forEach(b => {
    const bw = parseInt(b.dataset.w), bh = parseInt(b.dataset.h);
    b.classList.toggle('active', bw === state.w && bh === state.h);
  });
  renderAll();
}

function onFontSizeSlide() {
  state.fontSize = parseFloat($('fontSizeSlider').value);
  $('fontSizeNum').value = state.fontSize;
  renderAll();
}

function onFontSizeNum() {
  state.fontSize = Math.max(4, Math.min(200, parseFloat($('fontSizeNum').value) || 24));
  $('fontSizeSlider').value = state.fontSize;
  renderAll();
}

function onRadiusSlide() {
  state.radius = parseInt($('radiusSlider').value);
  $('radiusNum').value = state.radius;
  renderAll();
}

function onRadiusNum() {
  state.radius = Math.max(0, Math.min(100, parseInt($('radiusNum').value) || 0));
  $('radiusSlider').value = state.radius;
  renderAll();
}

function onBgTypeChange() {
  state.bgType = document.querySelector('input[name="bgType"]:checked').value;
  $('solidBgRow').classList.toggle('hidden', state.bgType !== 'solid');
  $('gradientBgRow').classList.toggle('hidden', state.bgType !== 'gradient');
  renderAll();
}

// ============ SIZE PRESETS ============
document.querySelectorAll('#sizePresets button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.w = parseInt(btn.dataset.w);
    state.h = parseInt(btn.dataset.h);
    $('tagWidth').value = state.w;
    $('tagHeight').value = state.h;
    state.fontSize = calcBestFontSize();
    $('fontSizeSlider').value = state.fontSize;
    $('fontSizeNum').value = state.fontSize;
    document.querySelectorAll('#sizePresets button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
  });
});

// ============ GRADIENT DIRECTION ============
document.querySelectorAll('#gradDirs button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.gradDir = parseInt(btn.dataset.dir);
    document.querySelectorAll('#gradDirs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
  });
});

// ============ FONT INSTALL ============
function installFont(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const buffer = e.target.result;
    const fontName = file.name.replace(/\.[^.]+$/, '');
    try {
      const fontFace = new FontFace(fontName, buffer);
      const loaded = await fontFace.load();
      document.fonts.add(loaded);
      state.customFonts[fontName] = true;
      // Add to dropdown
      const optgroup = $('customFontGroup');
      const exists = optgroup.querySelector(`option[value="${fontName}"]`);
      if (!exists) {
        const opt = document.createElement('option');
        opt.value = fontName;
        opt.textContent = '✨ ' + fontName;
        optgroup.appendChild(opt);
      }
      $('tagFont').value = fontName;
      state.font = fontName;
      renderAll();
      toast('字体 "' + fontName + '" 安装成功！');
    } catch (err) {
      toast('字体安装失败：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ============ COMPOSITE BACKGROUND ============
function loadBackground(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      state.bgImgObj = img;
      state.bgImg = e.target.result;
      // Default label position: center of bg
      state.labelX = Math.max(0, (img.width - state.w) / 2);
      state.labelY = Math.max(0, (img.height - state.h) / 2);
      renderComposite();
      $('compositeDrop').classList.add('has-bg');
      $('compositeDrop').querySelector('.composite-hint').classList.add('hidden');
      $('compositeControls').classList.remove('hidden');
      $('downloadCompositeBtn').disabled = false;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderComposite() {
  if (!state.bgImgObj) return;
  const img = state.bgImgObj;
  const container = $('compositeDrop');
  // Display scaled version
  const maxW = container.clientWidth - 32;
  const maxH = 400;
  const scale = Math.min(maxW / img.width, maxH / img.height, 1);
  const dispW = img.width * scale, dispH = img.height * scale;

  // Create or reuse composite canvas
  let canvas = container.querySelector('.composite-canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.className = 'composite-canvas';
    container.appendChild(canvas);
  }
  canvas.width = dispW;
  canvas.height = dispH;

  // Remove old overlay
  const oldOverlay = container.querySelector('.composite-overlay');
  if (oldOverlay) oldOverlay.remove();

  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, dispW, dispH);

  // Draw label overlay
  const lx = state.labelX * scale;
  const ly = state.labelY * scale;
  const lw = state.w * scale;
  const lh = state.h * scale;
  const lr = state.radius * scale;

  ctx.save();
  drawRoundedRect(ctx, lx, ly, lw, lh, lr);
  ctx.clip();

  if (state.bgType === 'gradient') {
    const angleRad = state.gradDir * Math.PI / 180;
    const cx = lx + lw / 2, cy = ly + lh / 2;
    const halfDiag = Math.sqrt(lw * lw + lh * lh) / 2;
    const gx1 = cx - Math.cos(angleRad) * halfDiag;
    const gy1 = cy - Math.sin(angleRad) * halfDiag;
    const gx2 = cx + Math.cos(angleRad) * halfDiag;
    const gy2 = cy + Math.sin(angleRad) * halfDiag;
    const grad = ctx.createLinearGradient(gx1, gy1, gx2, gy2);
    grad.addColorStop(0, state.gradStart);
    grad.addColorStop(1, state.gradEnd);
    ctx.fillStyle = grad;
  } else {
    ctx.fillStyle = state.bgColor;
  }
  ctx.fill();

  // Text
  const lines = state.text.split('\n');
  const scaledFS = state.fontSize * scale;
  const fontStyle = (state.bold ? 'bold ' : '') + (state.italic ? 'italic ' : '') + scaledFS + 'px "' + state.font + '", sans-serif';
  ctx.font = fontStyle;
  ctx.fillStyle = state.textColor;
  ctx.textBaseline = 'top';
  const lineHeight = scaledFS * 1.35;
  const totalH = lines.length * lineHeight;
  const padScale = getPadding();
  const scaledPad = { top: padScale.top * scale, left: padScale.left * scale, bottom: padScale.bottom * scale, right: padScale.right * scale };
  const availW = lw - scaledPad.left - scaledPad.right;
  const startY = ly + scaledPad.top + Math.max(0, (lh - scaledPad.top - scaledPad.bottom - totalH) / 2);
  for (let i = 0; i < lines.length; i++) {
    const y = startY + i * lineHeight;
    const tw = ctx.measureText(lines[i]).width;
    const x = lx + scaledPad.left + Math.max(0, (availW - tw) / 2);
    ctx.fillText(lines[i], x, y);
  }
  ctx.restore();

  // Draggable overlay
  const overlay = document.createElement('div');
  overlay.className = 'composite-overlay';
  overlay.style.left = lx + 'px';
  overlay.style.top = ly + 'px';
  overlay.style.width = lw + 'px';
  overlay.style.height = lh + 'px';
  overlay.style.border = '1px dashed rgba(255,255,255,0.3)';
  overlay.style.background = 'rgba(99,102,241,0.1)';
  overlay.addEventListener('mousedown', (e) => startDrag(e, scale));
  overlay.addEventListener('touchstart', (e) => startDrag(e, scale));
  container.appendChild(overlay);
}

function startDrag(e, scale) {
  e.preventDefault();
  state.dragging = true;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  state.dragOX = clientX - state.labelX * scale;
  state.dragOY = clientY - state.labelY * scale;

  const onMove = (ev) => {
    if (!state.dragging) return;
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    state.labelX = Math.max(0, Math.min(state.bgImgObj.width - state.w, (cx - state.dragOX) / scale));
    state.labelY = Math.max(0, Math.min(state.bgImgObj.height - state.h, (cy - state.dragOY) / scale));
    renderComposite();
  };
  const onUp = () => {
    state.dragging = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onMove);
  document.addEventListener('touchend', onUp);
}

function resetLabelPos() {
  if (!state.bgImgObj) return;
  state.labelX = Math.max(0, (state.bgImgObj.width - state.w) / 2);
  state.labelY = Math.max(0, (state.bgImgObj.height - state.h) / 2);
  renderComposite();
}

function clearBackground() {
  state.bgImg = null; state.bgImgObj = null;
  const container = document.getElementById('compositeDrop');
  container.classList.remove('has-bg');
  container.querySelector('.composite-hint').classList.remove('hidden');
  const canvas = container.querySelector('.composite-canvas');
  if (canvas) canvas.remove();
  const overlay = container.querySelector('.composite-overlay');
  if (overlay) overlay.remove();
  document.getElementById('compositeControls').classList.add('hidden');
  document.getElementById('downloadCompositeBtn').disabled = true;
}

// ============ DOWNLOADS ============
function getTagCanvas(stateType) {
  const c = document.createElement('canvas');
  c.width = state.w; c.height = state.h;
  const ctx = c.getContext('2d');

  drawRoundedRect(ctx, 0, 0, state.w, state.h, state.radius);
  ctx.save(); ctx.clip();
  if (stateType === 'active') {
    if (state.bgType === 'gradient') {
      fillGradient(ctx, 0, 0, state.w, state.h);
    } else {
      ctx.fillStyle = state.bgColor; ctx.fill();
    }
  }
  ctx.restore();

  const pad = getPadding();
  const lines = state.text.split('\n');
  const fontStyle = (state.bold ? 'bold ' : '') + (state.italic ? 'italic ' : '') + state.fontSize + 'px "' + state.font + '", sans-serif';
  ctx.font = fontStyle;
  ctx.fillStyle = stateType === 'active' ? (state.bgType === 'gradient' ? '#ffffff' : state.textColor) : state.textColor;
  ctx.textBaseline = 'top';
  const lineHeight = state.fontSize * 1.35;
  const totalH = lines.length * lineHeight;
  const availW = state.w - pad.left - pad.right;
  const startY = pad.top + Math.max(0, (state.h - pad.top - pad.bottom - totalH) / 2);
  for (let i = 0; i < lines.length; i++) {
    const y = startY + i * lineHeight;
    const tw = ctx.measureText(lines[i]).width;
    const x = pad.left + Math.max(0, (availW - tw) / 2);
    ctx.fillText(lines[i], x, y);
  }
  return c;
}

async function downloadZIP() {
  const zip = new JSZip();
  const labelCanvas = getTagCanvas('active');
  const labelBlob = await new Promise(r => labelCanvas.toBlob(r, 'image/png'));
  zip.file('channel-tag.png', labelBlob);

  if (state.bgImgObj) {
    const img = state.bgImgObj;
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);

    ctx.save();
    drawRoundedRect(ctx, state.labelX, state.labelY, state.w, state.h, state.radius);
    ctx.clip();
    if (state.bgType === 'gradient') {
      const angleRad = state.gradDir * Math.PI / 180;
      const cx = state.labelX + state.w / 2, cy = state.labelY + state.h / 2;
      const halfDiag = Math.sqrt(state.w * state.w + state.h * state.h) / 2;
      const gx1 = cx - Math.cos(angleRad) * halfDiag;
      const gy1 = cy - Math.sin(angleRad) * halfDiag;
      const gx2 = cx + Math.cos(angleRad) * halfDiag;
      const gy2 = cy + Math.sin(angleRad) * halfDiag;
      const grad = ctx.createLinearGradient(gx1, gy1, gx2, gy2);
      grad.addColorStop(0, state.gradStart);
      grad.addColorStop(1, state.gradEnd);
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = state.bgColor;
    }
    ctx.fill();

    const lines = state.text.split('\n');
    const fontStyle = (state.bold ? 'bold ' : '') + (state.italic ? 'italic ' : '') + state.fontSize + 'px "' + state.font + '", sans-serif';
    ctx.font = fontStyle;
    ctx.fillStyle = state.textColor;
    ctx.textBaseline = 'top';
    const pad = getPadding();
    const lineHeight = state.fontSize * 1.35;
    const totalH = lines.length * lineHeight;
    const availW = state.w - pad.left - pad.right;
    const startY = state.labelY + pad.top + Math.max(0, (state.h - pad.top - pad.bottom - totalH) / 2);
    for (let i = 0; i < lines.length; i++) {
      const y = startY + i * lineHeight;
      const tw = ctx.measureText(lines[i]).width;
      const x = state.labelX + pad.left + Math.max(0, (availW - tw) / 2);
      ctx.fillText(lines[i], x, y);
    }
    ctx.restore();

    const compBlob = await new Promise(r => c.toBlob(r, 'image/png'));
    zip.file('composite.png', compBlob);
  }

  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const link = document.createElement('a');
  link.download = 'channel-tag-pack.zip';
  link.href = URL.createObjectURL(zipBlob);
  link.click();
  toast('ZIP 打包下载完成！');
}

// ============ CSS CODE ============
function updateCSS() {
  const { w, h, radius, font, fontSize, bold, italic, textColor, bgType, bgColor, gradStart, gradEnd, gradDir } = state;
  const pad = getPadding();
  let css = '.channel-tag {\n' +
  '  width: ' + w + 'px;\n' +
  '  height: ' + h + 'px;\n' +
  '  border-radius: ' + radius + 'px;\n' +
  '  padding: ' + pad.top + 'px ' + pad.right + 'px ' + pad.bottom + 'px ' + pad.left + 'px;\n' +
  '  display: flex;\n' +
  '  align-items: center;\n' +
  '  justify-content: center;\n' +
  '  font-size: ' + fontSize + 'px;\n' +
  '  font-weight: ' + (bold ? '700' : '400') + ';\n' +
  '  font-style: ' + (italic ? 'italic' : 'normal') + ';\n' +
  '  font-family: "' + font + '", sans-serif;\n' +
  '  color: ' + textColor + ';\n' +
  '  box-sizing: border-box;\n' +
  '  cursor: pointer;\n' +
  '  transition: all 0.3s ease;\n' +
  '}\n';

  if (bgType === 'gradient') {
    css += '\n.channel-tag:hover,\n.channel-tag.active {\n' +
      '  background: linear-gradient(' + gradDir + 'deg, ' + gradStart + ', ' + gradEnd + ');\n' +
      '  color: #ffffff;\n' +
      '}';
  } else {
    css += '\n.channel-tag:hover,\n.channel-tag.active {\n' +
      '  background: ' + bgColor + ';\n' +
      '  color: ' + textColor + ';\n' +
      '}';
  }
  document.getElementById('cssContent').textContent = css;
}

function copyCSS() {
  navigator.clipboard.writeText(document.getElementById('cssContent').textContent);
  toast('CSS 已复制到剪贴板！');
}

// ============ UTILS ============
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function() { el.classList.remove('on'); }, 2000);
}

['textColor','bgColor','gradStart','gradEnd'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', function() {
    document.getElementById(id + 'Hex').textContent = document.getElementById(id).value;
    if (id !== 'gradStart' && id !== 'gradEnd' || state.bgType === 'gradient') renderAll();

});
